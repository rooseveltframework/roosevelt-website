name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: npm ci
      # this lints, builds the site the way it ships, and checks what the build produced
      - run: npm test
